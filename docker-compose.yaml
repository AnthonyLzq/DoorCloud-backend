services:
  doorcloud:
    build:
      context: .
    image: doorcloud
    container_name: doorcloud
    restart: unless-stopped
    ports:
      - '1996:1996'
    env_file:
      # Remote orchestrators (Coolify) supply the same vars as app-level env;
      # the local .env is optional so a fresh clone deploys without it.
      - path: .env
        required: false
    environment:
      # CD-7: the backend joins the same compose network as mosquitto/openwa,
      # so MQTT host resolves to the broker container service name.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1996
      MQTT_HOST: mosquitto
      # CD-7: env.ts defaults to mqtts (TLS); mosquitto here is plaintext.
      MQTT_PROTOCOL: mqtt
      MQTT_PORT: 1883
      # Runtime values resolved from Coolify app env (or local .env) at compose
      # config time. These satisfy env.ts validation inside the container; the
      # env_file optional .env is only a local-dev convenience (CD-10).
      MQTT_USER: ${MQTT_USER:-doorcloud-backend}
      MQTT_PASS: ${MQTT_PASS:-doorcloud-backend-local}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-doorcloud-device}
      MQTT_DEVICE_PASS: ${MQTT_DEVICE_PASS:-doorcloud-device-local}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-doorcloud-prod}
      MQTT_CLEAN: ${MQTT_CLEAN:-true}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_RECONNECT_PERIOD: ${MQTT_RECONNECT_PERIOD:-1000}
      MQTT_CONNECT_TIMEOUT: ${MQTT_CONNECT_TIMEOUT:-30000}
      MQTT_QOS: ${MQTT_QOS:-0}
      PHOTOS_DIR: /data/photos
      PHOTOS_BASE_URL: ${PHOTOS_BASE_URL:-https://doorcloud.noirsystems.net/photos}
      PHOTOS_URL_SECRET: ${PHOTOS_URL_SECRET:?PHOTOS_URL_SECRET is required}
      PHOTO_URL_TTL_MS: ${PHOTO_URL_TTL_MS:-300000}
      USER_NAME: ${USER_NAME:?USER_NAME is required}
      USER_PHONE: ${USER_PHONE:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa:2785}
      # SECRET-1: the internal OpenWA service name is a trusted base-URL
      # host (loopback is always allowed for local dev).
      OPENWA_ALLOWED_HOSTS: ${OPENWA_ALLOWED_HOSTS:-openwa}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-main}
      OPENWA_CHAT_ID: ${OPENWA_CHAT_ID:-}
      OPENWA_SSRF_ALLOWED_HOSTS: ${OPENWA_SSRF_ALLOWED_HOSTS:-}
      MODELS_CDN_URL: ${MODELS_CDN_URL:?MODELS_CDN_URL is required}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN is required}
      # AUTH-1: Basic Auth for the SPA is required in production (fail closed);
      # a deploy without these must abort instead of serving open.
      WEB_AUTH_USER: ${WEB_AUTH_USER:?WEB_AUTH_USER is required}
      WEB_AUTH_PASS: ${WEB_AUTH_PASS:?WEB_AUTH_PASS is required}
      # CD-8: state DB lives on a mounted volume so last_message_at survives
      # container recreation.
      STATE_DB_PATH: /data/state/app-state.db
      MODELS_DIR: /app/apps/backend/models
      # FACE_VERIFY_* defaults match the backend .env.example.
      FACE_VERIFY_THRESHOLD: ${FACE_VERIFY_THRESHOLD:-0.3435}
      FACE_VERIFY_MAX_PHOTOS: ${FACE_VERIFY_MAX_PHOTOS:-10}
    volumes:
      # CD-8: photos persist across container recreation. Literal target:
      # Coolify's compose security parser rejects '${}' in volume targets.
      - doorcloud-photos:/data/photos
      # CD-8: SQLite state persists (STATE_DB_PATH points inside this mount).
      - doorcloud-state:/data/state
      # CD-9/CD-11: ONNX models live in a named volume; the entrypoint
      # provisions it on first boot (downloaded, not baked into the image).
      # No host path required, so a fresh remote deploy boots without a bind.
      - doorcloud-models:/app/apps/backend/models
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1996/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mosquitto:
        condition: service_healthy
      openwa:
        condition: service_healthy

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    ports:
      - '2785:2785'
    environment:
      NODE_ENV: production
      PORT: 2785
      # OpenWA blocks outbound fetches to private IPs (SSRF guard). The photo
      # URL sent to WhatsApp points at the host via the compose gateway
      # (PHOTOS_BASE_URL), so allowlist that host. Comma-separated; leave
      # empty if PHOTOS_BASE_URL is publicly reachable.
      SSRF_ALLOWED_HOSTS: '${OPENWA_SSRF_ALLOWED_HOSTS:-}'
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS http://127.0.0.1:2785/api/health >/dev/null
          || curl -fsS http://127.0.0.1:2785/ >/dev/null
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  mosquitto:
    build:
      context: ./infra/mosquitto
    image: doorcloud-mosquitto
    container_name: doorcloud-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    environment:
      MOSQUITTO_BACKEND_PASSWORD: ${MQTT_PASS:-doorcloud-backend-local}
      MOSQUITTO_BACKEND_USER: ${MQTT_USER:-doorcloud-backend}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-doorcloud-device}
      MQTT_DEVICE_PASS: ${MQTT_DEVICE_PASS:-doorcloud-device-local}
    volumes:
      # Brok config/ACL/password-generator are baked into the image (Coolify
      # cannot bind repo-relative files from a compose app). Only runtime data
      # and the generated passwordfile live in named volumes.
      - doorcloud-mosquitto-pass:/mosquitto/config-private
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    entrypoint:
      - /bin/sh
      - /mosquitto/config/password-generator.sh
      - /mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mosquitto_sub -h 127.0.0.1 -p 1883
          -u "$$MOSQUITTO_BACKEND_USER"
          -P "$$MOSQUITTO_BACKEND_PASSWORD"
          -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 5s

volumes:
  doorcloud-photos:
  doorcloud-state:
  doorcloud-models:
  doorcloud-mosquitto-pass:
  openwa-data:
  mosquitto-data:
  mosquitto-log:
