allow_anonymous false
password_file /mosquitto/config-private/passwordfile
acl_file /mosquitto/config/aclfile
user mosquitto

# Internal plaintext listener: the fixed container-side port the doorcloud
# service targets (CD-7). The compose host mapping, when present, is driven
# by MOSQUITTO_PORT so it can never drift from the integration harness
# (REQ-3); with no mapping the broker is reachable only inside the compose
# network (CD-13).
listener 1883 0.0.0.0
max_packet_size 10485760
message_size_limit 10485760

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp true
connection_messages true
sys_interval 10

# TLS listener (8883), config-ready (T5.3): mosquitto 2.x does not expand
# environment variables in config files, so password-generator.sh appends
# this block verbatim to the rendered config when MOSQUITTO_TLS_CAFILE,
# MOSQUITTO_TLS_CERTFILE and MOSQUITTO_TLS_KEYFILE are all set in compose.
# Provision the certs in the image or a mounted volume first; the listener
# stays disabled until then (no plaintext fallback on 8883).
# listener 8883 0.0.0.0
# cafile ${MOSQUITTO_TLS_CAFILE}
# certfile ${MOSQUITTO_TLS_CERTFILE}
# keyfile ${MOSQUITTO_TLS_KEYFILE}
