name: Deploy to Coolify

# Gated deploy: every push to master first runs the Security - doorcloud
# workflow (Trivy + pnpm audit); this workflow starts only when that scan
# completed and fails fast unless it passed. Manual dispatch remains as an
# override. Coolify has no GitHub webhook configured for this repo, so the
# GitHub Actions pipeline is the deploy trigger. COOLIFY_TOKEN secret required.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Security - doorcloud']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Redeploy doorcloud on Coolify
    runs-on: ubuntu-latest
    steps:
      - name: Gate on security scan
        if: github.event_name == 'workflow_run'
        run: |
          conclusion="${{ github.event.workflow_run.conclusion }}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Security scan ${{ github.event.workflow_run.id }} concluded: $conclusion; deploy skipped"
            exit 1
          fi
          echo "Security scan passed; deploying."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Coolify CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/coollabsio/coolify-cli/main/scripts/install.sh | bash -s -- v1.6.2

      - name: Add Coolify context
        run: |
          coolify context add noirsystems https://coolify.noirsystems.net "${COOLIFY_TOKEN}" -f
          coolify context use noirsystems
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

      - name: Trigger deploy
        id: trigger
        run: |
          output=$(coolify deploy uuid mf3fhnumnhc0h66r8fkh1bsk --force)
          echo "$output"
          deployment_uuid=$(echo "$output" | grep -oE '[a-z0-9]{20,}' | head -1)
          if [ -z "$deployment_uuid" ]; then
            echo "::error::Could not extract deployment UUID from Coolify output"
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          for i in $(seq 1 100); do
            output=$(coolify deploy get "$DEPLOYMENT_UUID" || true)
            status=$(echo "$output" | sed -n '4p' | awk -F'│' '{gsub(/ /,"",$5); print $5}')
            echo "progress $i: status=$status"
            case "$status" in
              finished) echo "deploy finished OK"; exit 0 ;;
              failed|cancelled|canceled) echo "::error::Deploy $DEPLOYMENT_UUID ended as $status"; exit 1 ;;
              *) sleep 15 ;;
            esac
          done
          echo "::error::Timed out waiting for deployment $DEPLOYMENT_UUID"
          exit 1