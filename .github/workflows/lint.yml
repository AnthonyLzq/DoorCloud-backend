name: Lint - doorcloud

on: [push]

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (pnpm via packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # Root lint delegates to every workspace package (`pnpm -r lint`);
      # biome checks src/ and test/ per package.
      - name: Run linters
        run: pnpm lint
