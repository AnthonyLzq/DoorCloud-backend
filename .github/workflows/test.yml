name: Tests - doorcloud

on: [push]

jobs:
  test:
    name: Unit tests, typecheck and web build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Set up Node.js (pnpm via packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests (turbo orders shared build first)
        run: pnpm test:ci
        env:
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          NODE_ENV: ci

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build all packages via turbo
        run: pnpm build

  mqtt-integration:
    name: MQTT integration tests with Mosquitto
    runs-on: ubuntu-latest

    # Job-level env: compose interpolates the whole file (all services) even
    # when only mosquitto is started, and every step (including cleanup)
    # needs the required vars. The overlay publishes the broker on
    # MOSQUITTO_PORT (REQ-3, same source as run-integration-tests.sh).
    env:
      MOSQUITTO_PORT: 1883
      MQTT_USER: doorcloud-backend
      MQTT_PASS: doorcloud-backend-local
      SETUP_TOKEN: dev-setup-token
      WEB_AUTH_USER: dev
      WEB_AUTH_PASS: dev
      PHOTOS_URL_SECRET: dev
      USER_NAME: Dev
      MODELS_CDN_URL: https://models.example.com

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Set up Node.js (pnpm via packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package via turbo
        run: pnpm exec turbo run build --filter=@doorcloud/shared

      - name: Generate Mosquitto password file
        run: ./apps/backend/scripts/mosquitto/create-password-file.sh

      - name: Start Mosquitto broker
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.integration.yaml up -d mosquitto
          echo "Waiting for Mosquitto to be ready..."
          timeout=30
          counter=0
          until docker compose exec -T mosquitto mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 1 2>/dev/null || [ $counter -eq $timeout ]; do
            sleep 1
            counter=$((counter + 1))
          done
          if [ $counter -eq $timeout ]; then
            echo "Mosquitto failed to start within ${timeout}s"
            docker compose logs mosquitto
            exit 1
          fi
          echo "Mosquitto is ready"

      - name: Run MQTT integration tests
        run: pnpm --filter @doorcloud/backend test:mqtt:integration
        env:
          MQTT_HOST: localhost
          MQTT_PORT: 1883
          MQTT_PROTOCOL: mqtt
          NODE_ENV: ci

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.integration.yaml down -v
          docker system prune -f

  e2e:
    name: Web SPA smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Set up Node.js (pnpm via packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package via turbo
        run: pnpm exec turbo run build --filter=@doorcloud/shared

      - name: Install Playwright browsers
        run: pnpm --filter @doorcloud/web exec playwright install --with-deps chromium

      # The config webServer builds the SPA and serves it with vite preview;
      # the spec stubs /setup and /admin, so no backend or MQTT is required.
      - name: Run Playwright smoke tests
        run: pnpm --filter @doorcloud/web test:e2e
